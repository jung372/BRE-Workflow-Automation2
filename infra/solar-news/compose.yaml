# Adds only the news service. It neither replaces nor upgrades the existing n8n.
services:
  solar-news-service:
    build:
      context: ../..
      dockerfile: infra/wind-news/Dockerfile
      args:
        PYTHON_IMAGE: ${SOLAR_NEWS_PYTHON_IMAGE:-python:3.12-slim-bookworm}
        CODEX_VERSION: ${SOLAR_NEWS_CODEX_VERSION:-0.159.2}
    image: bre-solar-news:${SOLAR_NEWS_RELEASE:-local}
    init: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    environment:
      TZ: Asia/Seoul
      BRE_NEWS_INDUSTRY: solar
      BRE_NEWS_PUBLISH_LOCK: /var/lib/bre-news-locks/publish.lock
      SOLAR_NEWS_HOST: 0.0.0.0
      SOLAR_NEWS_PORT: "8091"
      SOLAR_NEWS_RUNTIME_DIR: /var/lib/bre-solar/runtime
      SOLAR_NEWS_PUBLISH_CLONE: /var/lib/bre-solar/publish
      SOLAR_NEWS_CONFIG: /etc/bre-solar/config.json
      SOLAR_NEWS_CODEX_HOME: /var/lib/bre-solar/codex-auth
      SOLAR_NEWS_API_TOKEN: ${SOLAR_NEWS_API_TOKEN:?Set a dedicated service token}
      SOLAR_NEWS_NAVER_CLIENT_ID: ${SOLAR_NEWS_NAVER_CLIENT_ID:-}
      SOLAR_NEWS_NAVER_CLIENT_SECRET: ${SOLAR_NEWS_NAVER_CLIENT_SECRET:-}
      SOLAR_NEWS_TEAMS_WEBHOOK_URL: ${SOLAR_NEWS_TEAMS_WEBHOOK_URL:-}
      SOLAR_NEWS_TEAMS_CARD_FORMAT: ${SOLAR_NEWS_TEAMS_CARD_FORMAT:-adaptive}
      GIT_TERMINAL_PROMPT: "0"
      GIT_CONFIG_GLOBAL: /var/lib/bre-solar/runtime/gitconfig
    ports:
      - "127.0.0.1:${SOLAR_NEWS_PORT:-8091}:8091"
    volumes:
      - ${BRE_NEWS_LOCK_ROOT:?Set the same shared lock directory for both news services}:/var/lib/bre-news-locks
      - ${SOLAR_NEWS_RUNTIME_ROOT:?Set private runtime outside repository}:/var/lib/bre-solar/runtime
      - ${SOLAR_NEWS_PUBLISH_ROOT:?Set dedicated publish clone}:/var/lib/bre-solar/publish
      - ${SOLAR_NEWS_CONFIG_FILE:?Set non-secret policy file}:/etc/bre-solar/config.json:ro
      - ${SOLAR_NEWS_CODEX_AUTH_ROOT:?Set private Codex login directory}:/var/lib/bre-solar/codex-auth
    networks:
      - existing-n8n
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8091/health/ready', headers={'Authorization': 'Bearer ' + os.environ['SOLAR_NEWS_API_TOKEN']}), timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    stop_grace_period: 60s
networks:
  existing-n8n:
    external: true
    name: ${SOLAR_NEWS_DOCKER_NETWORK:?Set the existing n8n Docker network name}
