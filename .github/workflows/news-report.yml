name: 뉴스 브리핑 Teams 수동 확인·발송 (정기 발송은 n8n 08:30)

on:
  # n8n sends at 08:30 and retries every 5 minutes through 09:25.
  workflow_dispatch:
    inputs:
      mode:
        description: 'preview: 발송 없는 검증 / send: 실제 발송(기존 발송은 중복 방지)'
        type: choice
        options: [preview, send, diagnose]
        default: preview
      issue_date:
        description: '보고서 날짜 YYYY-MM-DD (비우면 서울 기준 오늘)'
        type: string
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

# 같은 서버 checkout을 사용하는 배포와 겹치지 않게 한다.
concurrency:
  group: bre-workflow-production
  cancel-in-progress: false

jobs:
  news-report:
    if: github.ref == 'refs/heads/main' || inputs.mode == 'diagnose'
    runs-on: [self-hosted, windows, x64, bre-workflow-server]
    timeout-minutes: 5
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: 뉴스 브리핑 확인 및 Teams 보고
        shell: powershell
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          NEWS_REPORT_MODE: ${{ inputs.mode || 'preview' }}
          NEWS_REPORT_DATE: ${{ inputs.issue_date }}
        run: .\scripts\wind_news\report_teams.ps1
