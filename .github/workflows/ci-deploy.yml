name: 검증 및 서버 배포

on:
  push:
    branches:
      - main
      - 'feature/**'
    # 서버가 매시간 push 하는 데이터 파일은 배포를 트리거하지 않는다.
    paths-ignore:
      - 'data/status.json'
      - 'last_state.json'
      - 'data/wind-news/**'
      - 'docs/**'
      - '**/*.md'
      # 키워드는 설정 데이터다. publish clone 에서 읽으므로 재배포가 필요 없고,
      # 검증은 validate-keywords.yml 이 담당한다.
      - 'config/keywords.json'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      news_action:
        description: 'News server operation (preflight is read-only)'
        type: choice
        options: [normal, preflight, install, connect, verify, oauth, launch, correct, refresh, dedup-correct, briefing]
        default: normal

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: bre-workflow-production
  cancel-in-progress: false

jobs:
  news-oauth:
    if: github.event_name == 'workflow_dispatch' && inputs.news_action == 'oauth'
    runs-on: [self-hosted, windows, x64, bre-workflow-server]
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Send device login challenge over private Taildrop
        shell: powershell
        run: .\scripts\wind_news\start_oauth.ps1

  news-install:
    needs: test
    if: github.event_name == 'workflow_dispatch' && (inputs.news_action == 'install' || inputs.news_action == 'connect' || inputs.news_action == 'launch' || inputs.news_action == 'correct' || inputs.news_action == 'refresh' || inputs.news_action == 'dedup-correct' || inputs.news_action == 'briefing')
    runs-on: [self-hosted, windows, x64, bre-workflow-server]
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install isolated news container in existing WSL
        shell: powershell
        env:
          NEWS_ACTION: ${{ inputs.news_action }}
        run: .\scripts\wind_news\operate_server.ps1 -Action $env:NEWS_ACTION

  news-preflight:
    if: github.event_name == 'workflow_dispatch' && (inputs.news_action == 'preflight' || inputs.news_action == 'verify')
    runs-on: [self-hosted, windows, x64, bre-workflow-server]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect news service prerequisites without secrets
        shell: powershell
        env:
          NEWS_ACTION: ${{ inputs.news_action }}
        run: |
          if ($env:NEWS_ACTION -eq 'verify') {
            .\scripts\wind_news\operate_server.ps1 -Action verify
          } else {
            .\scripts\wind_news\preflight_server.ps1
          }

  test:
    if: inputs.news_action != 'preflight' && inputs.news_action != 'verify' && inputs.news_action != 'oauth'
    runs-on: windows-latest   # 서버 PC와 동일한 OS에서 검증한다
    timeout-minutes: 20

    steps:
      - name: 📥 코드 체크아웃
        uses: actions/checkout@v4

      - name: 🐍 Python 3.11 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 📦 패키지 설치
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -r requirements.txt
          # 뉴스 DB 의존성은 CI와 뉴스 서비스 환경에만 설치한다.
          python -m pip install --disable-pip-version-check -r news/requirements.txt

      - name: Node.js for browser module tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 🔍 문법 검사
        shell: pwsh
        run: |
          python -m compileall -q `
            config.py state.py runtime_config.py keywords.py scraper.py run_local.py `
            notify_teams.py push_to_github.py dashboard_app.py `
            logic scrapers presentation news tests scripts/wind_news

      - name: 🧪 단위 테스트
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: 뉴스 웹 모듈 검증
        run: node --test tests/test_wind_news_frontend.js

      - name: 📥 진입점 임포트 확인
        shell: pwsh
        run: |
          # 예약 작업과 report.yml 이 실제로 실행하는 경로를 확인한다.
          # notify_teams 는 python-dotenv 없이도 import 되어야 한다(report.yml 은
          # requests 만 설치하므로 runtime_config 의 dotenv 임포트가 선택적이어야 함).
          python run_local.py --help
          python -c "import notify_teams, push_to_github, dashboard_app, scraper"

  deploy:
    needs: test
    if: >-
      github.repository == 'jung372/BRE-Workflow-Automation2' &&
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      (inputs.news_action == '' || inputs.news_action == 'normal') &&
      vars.SERVER_DEPLOY_ENABLED == 'true'
    runs-on:
      - self-hosted
      - windows
      - x64
      - bre-workflow-server
    timeout-minutes: 45     # 실제 스크래핑 스모크 포함
    environment: production

    steps:
      - name: 📥 검증된 commit 체크아웃
        uses: actions/checkout@v4
        with:
          clean: true

      - name: 🚀 배포
        shell: powershell
        run: |
          .\scripts\deploy_server.ps1 `
            -SourcePath '${{ github.workspace }}' `
            -InstallRoot 'D:\05 AI Study\BRE Workflow Automation' `
            -RuntimeRoot 'D:\05 AI Study\BRE_Workflow_runtime' `
            -TaskName 'BRE Scraper' `
            -CommitSha '${{ github.sha }}' `
            -SmokeMinOk ${{ vars.BRE_SMOKE_MIN_OK || 3 }}
