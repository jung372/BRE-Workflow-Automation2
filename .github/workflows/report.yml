name: Teams 정기 보고 (서버 평일 08:30, 수동 확인)

on:
  # Server clock owns weekdays 08:30-08:55 retries; GitHub cron can be hours late.
  workflow_dispatch:
    inputs:
      preview:
        description: '발송 없이 비교 데이터와 오늘 발송 상태 확인'
        type: boolean
        default: true
      force_send:
        description: '신규글 0건이어도 수동 발송 (하루 중복 방지는 유지)'
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
permissions:
  contents: read
concurrency:
  group: bre-teams-regular-report
  cancel-in-progress: false
jobs:
  report:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, windows, x64, bre-workflow-server]
    environment: production
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Inspect or send using the shared server daily ledger
        shell: powershell
        env:
          REPORT_PREVIEW: ${{ inputs.preview }}
          REPORT_FORCE: ${{ inputs.force_send }}
        run: .\scripts\run_teams_report.ps1 -Manual -Preview:($env:REPORT_PREVIEW -ne 'false') -Force:($env:REPORT_FORCE -eq 'true')
